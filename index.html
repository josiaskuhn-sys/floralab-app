<!-- Exemplo básico do trecho de envio no seu index.html -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="enviarFoto(this)">
<button onclick="document.getElementById('cameraInput').click()">Tirar Foto do Ambiente</button>

<div id="resultadoAnalise"></div>

<script>
async function enviarComando(file) {
    let formData = new FormData();
    formData.append("file", file);
    
    document.getElementById("resultadoAnalise").innerText = "Analisando o ambiente com IA...";
    
    let response = await fetch('/analisar-ambiente', {
        method: 'POST',
        body: formData
    });
    
    let data = await response.json();
    if(response.ok) {
        document.getElementById("resultadoAnalise").innerHTML = data.resultado.replace(/\n/g, '<br>');
    } else {
        document.getElementById("resultadoAnalise").innerText = "Erro na análise: " + data.detail;
    }
}
function enviarFoto(input) {
    if (input.files && input.files[0]) {
        enviarComando(input.files[0]);
    }
}
</script>
